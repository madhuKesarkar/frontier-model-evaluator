# Runs on every commit. Install once with:  pip install pre-commit && pre-commit install
# Run on everything manually:              pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Python lint + format (config in ruff.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Secret scanning (config in .gitleaks.toml) — supports BE-AC-23 / API-AC-04
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

# Frontend hooks (Prettier, ESLint) are added in task 0.3, when frontend/package.json exists.
# mypy runs via `make lint` (task 0.4) because it needs the backend's installed dependencies.
