task_id: RA-S-01
version: 1
category: reasoning
tier: simple
title: Elapsed time in minutes
prompt: |
  A regression test run starts at 09:40 and finishes at 13:15 on the same day.
  How many minutes did it take?
  End your reply with a final line in exactly this form: ANSWER: <number>
checkers:
  - type: exact_match
    extract: {answer_line: "ANSWER:"}
    expected: "215"
    on_fail: {type: REASONING_ERROR, severity: S2}
reference_response: |
  From 09:40 to 13:40 is 240 minutes; 13:15 is 25 minutes earlier, so 215 minutes.
  ANSWER: 215
