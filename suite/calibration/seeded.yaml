  - id: S-CG
    task_id: CG-C-01
    flaw: Expiry is ignored completely (ttl_seconds is stored but never checked).
    response: |
      ```python
      import time
      from collections import OrderedDict

      class TTLCache:
          def __init__(self, capacity, ttl_seconds, clock=time.monotonic):
              if capacity < 1 or ttl_seconds <= 0:
                  raise ValueError("invalid")
              self.capacity, self.ttl, self.clock = capacity, ttl_seconds, clock
              self.data = OrderedDict()

          def get(self, key, default=None):
              if key not in self.data:
                  return default
              self.data.move_to_end(key)
              return self.data[key]

          def put(self, key, value):
              if key in self.data:
                  self.data.move_to_end(key)
              elif len(self.data) >= self.capacity:
                  self.data.popitem(last=False)
              self.data[key] = value

          def __len__(self):
              return len(self.data)
      ```

