  - id: G-CG
    task_id: CG-C-01
    human_score: 3
    why: >-
      Passes the behaviour the tests check, but get() and put() scan every entry on each call to
      purge expired items, which breaks rule 6 (O(1) average). Needs rework for the stated
      performance requirement; otherwise clear.
    response: |
      ```python
      import time
      from collections import OrderedDict
      from typing import Any, Callable, Hashable

      class TTLCache:
          def __init__(self, capacity: int, ttl_seconds: float,
                       clock: Callable[[], float] = time.monotonic) -> None:
              if capacity < 1 or ttl_seconds <= 0:
                  raise ValueError("invalid capacity or ttl")
              self.capacity, self.ttl, self.clock = capacity, ttl_seconds, clock
              self.data: "OrderedDict[Hashable, tuple[Any, float]]" = OrderedDict()

          def _purge(self) -> None:
              now = self.clock()
              for key in [k for k, (_, exp) in self.data.items() if now >= exp]:
                  del self.data[key]

          def get(self, key: Hashable, default: Any = None) -> Any:
              self._purge()
              if key not in self.data:
                  return default
              self.data.move_to_end(key)
              return self.data[key][0]

          def put(self, key: Hashable, value: Any) -> None:
              self._purge()
              if key in self.data:
                  self.data.move_to_end(key)
              elif len(self.data) >= self.capacity:
                  self.data.popitem(last=False)
              self.data[key] = (value, self.clock() + self.ttl)

          def __len__(self) -> int:
              self._purge()
              return len(self.data)
      ```

