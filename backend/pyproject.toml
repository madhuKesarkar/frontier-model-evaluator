[project]
name = "fme-backend"
version = "0.1.0"
description = "Frontier Model Evaluator — backend API and evaluation engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pyyaml==6.0.2",
  "jsonschema==4.23.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "mypy==1.14.1",
  "ruff==0.8.4",
  "types-PyYAML==6.0.12.20241230",
  "types-jsonschema==4.23.0.20241208",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: needs a running Docker daemon and the sandbox image"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
exclude = ['^\.venv/']
